<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Sign In | AiSmartOS
    </title>

    <meta
        name="description"
        content="Sign in or create your AiSmartOS account."
    >

    <link
        rel="icon"
        type="image/jpeg"
        href="IMG-20260805-WA0000.jpg"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* =================================================
           AUTH PAGE
        ================================================= */

        body.auth-page {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px 18px;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(66, 103, 255, 0.18),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(139, 92, 246, 0.15),
                    transparent 35%
                ),
                #070b17;

        }


        .auth-wrapper {

            width: 100%;

            max-width: 470px;

        }


        .auth-logo {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            color: white;

            text-decoration: none;

            font-size: 25px;

            font-weight: 700;

            margin-bottom: 25px;

        }


        .auth-logo img {

            width: 46px;

            height: 46px;

            border-radius: 12px;

            object-fit: contain;

        }


        .auth-card {

            padding: 32px;

            border-radius: 24px;

            background:
                rgba(255,255,255,0.055);

            border:
                1px solid rgba(255,255,255,0.10);

            backdrop-filter:
                blur(20px);

            box-shadow:
                0 25px 80px
                rgba(0,0,0,0.35);

        }


        .auth-card h1 {

            text-align: center;

            font-size: 32px;

            margin-bottom: 8px;

        }


        .auth-subtitle {

            text-align: center;

            color: #aab3cc;

            margin-bottom: 28px;

        }


        .auth-form {

            display: flex;

            flex-direction: column;

            gap: 15px;

        }


        .auth-form label {

            color: #cbd2e7;

            font-size: 14px;

            font-weight: 600;

        }


        .auth-form input {

            width: 100%;

            padding: 13px 15px;

            border-radius: 11px;

            border:
                1px solid
                rgba(255,255,255,0.10);

            background:
                rgba(0,0,0,0.22);

            color: white;

            outline: none;

            font-size: 15px;

        }


        .auth-form input:focus {

            border-color:
                rgba(100,120,255,0.8);

            box-shadow:
                0 0 0 3px
                rgba(70,90,255,0.10);

        }


        .auth-submit {

            border: none;

            cursor: pointer;

            padding: 13px 18px;

            border-radius: 11px;

            color: white;

            font-size: 15px;

            font-weight: 600;

            background:
                linear-gradient(
                    135deg,
                    #4267ff,
                    #8b5cf6
                );

            transition:
                transform 0.2s ease,
                opacity 0.2s ease;

        }


        .auth-submit:hover {

            transform:
                translateY(-2px);

        }


        .auth-submit:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        /* =================================================
           PASSWORD STRENGTH
        ================================================= */

        .password-strength-wrapper {

            display: flex;

            flex-direction: column;

            gap: 7px;

        }


        .password-strength-track {

            width: 100%;

            height: 5px;

            border-radius: 20px;

            overflow: hidden;

            background:
                rgba(255,255,255,0.10);

        }


        .password-strength-bar {

            width: 0;

            height: 100%;

            transition:
                width 0.25s ease;

        }


        .password-strength-bar.basic {

            background: #ef4444;

        }


        .password-strength-bar.normal {

            background: #facc15;

        }


        .password-strength-bar.strong {

            background: #22c55e;

        }


        #password-strength-label {

            font-size: 13px;

            font-weight: 600;

        }


        #password-strength-label.basic {

            color: #ef4444;

        }


        #password-strength-label.normal {

            color: #facc15;

        }


        #password-strength-label.strong {

            color: #22c55e;

        }


        /* =================================================
           MESSAGE
        ================================================= */

        .auth-message {

            display: none;

            padding: 12px 14px;

            margin-bottom: 16px;

            border-radius: 10px;

            font-size: 14px;

        }


        .auth-message.error {

            color: #fecaca;

            background:
                rgba(239,68,68,0.12);

            border:
                1px solid
                rgba(239,68,68,0.25);

        }


        .auth-message.success {

            color: #bbf7d0;

            background:
                rgba(34,197,94,0.12);

            border:
                1px solid
                rgba(34,197,94,0.25);

        }


        /* =================================================
           DIVIDER
        ================================================= */

        .auth-divider {

            display: flex;

            align-items: center;

            gap: 12px;

            margin: 24px 0;

            color: #7f89a5;

            font-size: 13px;

        }


        .auth-divider::before,
        .auth-divider::after {

            content: "";

            flex: 1;

            height: 1px;

            background:
                rgba(255,255,255,0.09);

        }


        /* =================================================
           SOCIAL LOGIN
        ================================================= */

        .social-login {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 10px;

        }


        .social-login button {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 9px;

            padding: 12px 10px;

            border-radius: 10px;

            border:
                1px solid
                rgba(255,255,255,0.10);

            background:
                rgba(255,255,255,0.04);

            color: white;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;

        }


        .social-login button:hover {

            background:
                rgba(255,255,255,0.08);

            transform:
                translateY(-1px);

        }


        .social-icon {

            width: 20px;

            height: 20px;

            display: block;

        }


        /* =================================================
           SWITCH
        ================================================= */

        .auth-switch {

            text-align: center;

            color: #aab3cc;

            margin-top: 24px;

            font-size: 14px;

        }


        .auth-switch button {

            border: none;

            background: none;

            color: #8fa5ff;

            cursor: pointer;

            font-weight: 600;

        }


        .back-home {

            display: block;

            text-align: center;

            color: #8f99b5;

            text-decoration: none;

            margin-top: 20px;

            font-size: 14px;

        }


        .back-home:hover {

            color: white;

        }


        /* =================================================
           HIDDEN FORM
        ================================================= */

        .auth-form.hidden {

            display: none;

        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 500px) {

            .auth-card {

                padding: 24px 20px;

                border-radius: 20px;

            }


            .auth-card h1 {

                font-size: 28px;

            }


            .social-login {

                grid-template-columns: 1fr;

            }

        }

    </style>

</head>


<body class="auth-page">


    <div class="auth-wrapper">


        <!-- LOGO -->

        <a
            href="index.html"
            class="auth-logo"
        >

            <img
                src="IMG-20260805-WA0000.jpg"
                alt="AiSmartOS"
            >

            <span>
                AiSmartOS
            </span>

        </a>


        <div class="auth-card">


            <!-- =========================================
                 SIGN IN
            ========================================== -->

            <div id="signin-view">

                <h1>
                    Welcome Back
                </h1>

                <p class="auth-subtitle">
                    Sign in to continue to AiSmartOS.
                </p>


                <div
                    id="auth-message"
                    class="auth-message"
                ></div>


                <form
                    id="signin-form"
                    class="auth-form"
                >

                    <div>

                        <label
                            for="signin-email"
                        >
                            Email
                        </label>

                        <input
                            id="signin-email"
                            type="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <div>

                        <label
                            for="signin-password"
                        >
                            Password
                        </label>

                        <input
                            id="signin-password"
                            type="password"
                            placeholder="Your password"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="auth-submit"
                    >
                        Sign In
                    </button>

                </form>


                <div class="auth-divider">
                    <span>
                        OR
                    </span>
                </div>


                <!-- SOCIAL LOGIN -->

                <div class="social-login">


                    <!-- Google -->

                    <button
                        type="button"
                        data-provider="google"
                    >

                        <img
                            class="social-icon"
                            src="https://cdn.simpleicons.org/google"
                            alt=""
                        >

                        <span>
                            Google
                        </span>

                    </button>


                    <!-- Facebook -->

                    <button
                        type="button"
                        data-provider="facebook"
                    >

                        <img
                            class="social-icon"
                            src="https://cdn.simpleicons.org/facebook"
                            alt=""
                        >

                        <span>
                            Facebook
                        </span>

                    </button>


                    <!-- GitHub -->

                    <button
                        type="button"
                        data-provider="github"
                    >

                        <img
                            class="social-icon"
                            src="https://cdn.simpleicons.org/github"
                            alt=""
                        >

                        <span>
                            GitHub
                        </span>

                    </button>


                    <!-- Discord -->

                    <button
                        type="button"
                        data-provider="discord"
                    >

                        <img
                            class="social-icon"
                            src="https://cdn.simpleicons.org/discord"
                            alt=""
                        >

                        <span>
                            Discord
                        </span>

                    </button>

                </div>


                <p class="auth-switch">

                    Don't have an account?

                    <button
                        type="button"
                        id="show-signup"
                    >
                        Create Account
                    </button>

                </p>

            </div>


            <!-- =========================================
                 SIGN UP
            ========================================== -->

            <div
                id="signup-view"
                style="display:none;"
            >

                <h1>
                    Create Account
                </h1>

                <p class="auth-subtitle">
                    Create your AiSmartOS account.
                </p>


                <div
                    id="signup-message"
                    class="auth-message"
                ></div>


                <form
                    id="signup-form"
                    class="auth-form"
                >


                    <div>

                        <label
                            for="signup-first-name"
                        >
                            First Name
                        </label>

                        <input
                            id="signup-first-name"
                            type="text"
                            placeholder="Your first name"
                            autocomplete="given-name"
                            required
                        >

                    </div>


                    <div>

                        <label
                            for="signup-email"
                        >
                            Email
                        </label>

                        <input
                            id="signup-email"
                            type="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <div>

                        <label
                            for="signup-password"
                        >
                            Password
                        </label>

                        <input
                            id="signup-password"
                            type="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required
                        >


                        <div
                            class="password-strength-wrapper"
                            style="margin-top:8px;"
                        >

                            <div
                                class="password-strength-track"
                            >

                                <div
                                    id="password-strength"
                                    class="password-strength-bar"
                                ></div>

                            </div>


                            <span
                                id="password-strength-label"
                            ></span>

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="auth-submit"
                    >
                        Create Account
                    </button>

                </form>


                <p class="auth-switch">

                    Already have an account?

                    <button
                        type="button"
                        id="show-signin"
                    >
                        Sign In
                    </button>

                </p>

            </div>


        </div>


        <a
            href="index.html"
            class="back-home"
        >
            ← Back to AiSmartOS
        </a>


    </div>


    <!-- =============================================
         SUPABASE
    ============================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- CONFIG -->

    <script
        src="config.js"
    ></script>


    <!-- AUTH -->

    <script
        src="auth.js"
    ></script>


    <!-- FORM SWITCHING -->

    <script>

        const signinView =
            document.getElementById("signin-view");

        const signupView =
            document.getElementById("signup-view");


        const showSignup =
            document.getElementById("show-signup");

        const showSignin =
            document.getElementById("show-signin");


        showSignup.addEventListener(
            "click",
            () => {

                signinView.style.display =
                    "none";

                signupView.style.display =
                    "block";

            }
        );


        showSignin.addEventListener(
            "click",
            () => {

                signupView.style.display =
                    "none";

                signinView.style.display =
                    "block";

            }
        );


        /*
           Keep the correct message box compatible
           with auth.js.
        */

        const signupForm =
            document.getElementById("signup-form");


        const signupMessage =
            document.getElementById("signup-message");


        const originalShowMessage =
            window.showMessage;


    </script>

</body>

</html>
