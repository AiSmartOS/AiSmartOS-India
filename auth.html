<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign In | AiSmartOS</title>

    <meta
        name="description"
        content="Sign in to AiSmartOS"
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #172554 0%,
                    #07111f 45%,
                    #020617 100%
                );

            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 24px;
        }

        .auth-container {
            width: 100%;
            max-width: 430px;

            background: rgba(15, 23, 42, 0.82);

            border: 1px solid rgba(255, 255, 255, 0.12);

            border-radius: 24px;

            padding: 38px 28px 28px;

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.45);

            backdrop-filter: blur(18px);

            text-align: center;
        }

        .logo {
            width: 82px;
            height: 82px;

            border-radius: 20px;

            object-fit: cover;

            margin-bottom: 20px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #b8c3d1;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .provider-button {
            width: 100%;

            min-height: 54px;

            margin-bottom: 12px;

            border-radius: 13px;

            border: 1px solid rgba(255, 255, 255, 0.18);

            background: rgba(255, 255, 255, 0.07);

            color: white;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease;
        }

        .provider-button:hover {
            transform: translateY(-2px);

            background: rgba(255, 255, 255, 0.13);

            border-color: rgba(255, 255, 255, 0.3);
        }

        .provider-button:active {
            transform: scale(0.98);
        }

        .google {
            background: rgba(66, 133, 244, 0.16);
        }

        .facebook {
            background: rgba(24, 119, 242, 0.16);
        }

        .github {
            background: rgba(255, 255, 255, 0.08);
        }

        .discord {
            background: rgba(88, 101, 242, 0.16);
        }

        .icon {
            margin-right: 10px;
            font-size: 19px;
        }

        .divider {
            display: flex;
            align-items: center;

            gap: 14px;

            margin: 25px 0;

            color: #94a3b8;

            font-size: 14px;
        }

        .divider::before,
        .divider::after {
            content: "";

            flex: 1;

            height: 1px;

            background: rgba(255, 255, 255, 0.15);
        }

        .email-input {
            width: 100%;

            height: 54px;

            padding: 0 16px;

            border-radius: 13px;

            border: 1px solid rgba(255, 255, 255, 0.15);

            background: rgba(0, 0, 0, 0.2);

            color: white;

            font-size: 16px;

            outline: none;

            margin-bottom: 12px;
        }

        .email-input::placeholder {
            color: #94a3b8;
        }

        .email-input:focus {
            border-color: #38bdf8;

            box-shadow:
                0 0 0 3px rgba(56, 189, 248, 0.12);
        }

        .email-button {
            width: 100%;

            height: 54px;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #38bdf8,
                    #2563eb
                );

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease;
        }

        .email-button:hover {
            transform: translateY(-2px);
        }

        .email-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            min-height: 24px;

            margin-top: 18px;

            font-size: 14px;

            color: #cbd5e1;
        }

        .back-link {
            display: inline-block;

            margin-top: 25px;

            color: #93c5fd;

            text-decoration: none;

            font-size: 15px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .footer {
            margin-top: 22px;

            color: #64748b;

            font-size: 13px;
        }

        @media (max-width: 480px) {

            body {
                padding: 15px;
            }

            .auth-container {
                padding: 32px 20px 24px;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="auth-container">

        <!-- AiSmartOS Logo -->
        <img
            src="IMG-20260805-WA0000.jpg"
            alt="AiSmartOS Logo"
            class="logo"
        >

        <h1>Welcome to AiSmartOS</h1>

        <p class="subtitle">
            Sign in to continue
        </p>


        <!-- =========================
             SOCIAL LOGIN
        ========================== -->

        <button
            type="button"
            id="google-login"
            class="provider-button google"
        >
            <span class="icon">🌐</span>
            Continue with Google
        </button>


        <button
            type="button"
            id="facebook-login"
            class="provider-button facebook"
        >
            <span class="icon">ⓕ</span>
            Continue with Facebook
        </button>


        <button
            type="button"
            id="github-login"
            class="provider-button github"
        >
            <span class="icon">◉</span>
            Continue with GitHub
        </button>


        <button
            type="button"
            id="discord-login"
            class="provider-button discord"
        >
            <span class="icon">💬</span>
            Continue with Discord
        </button>


        <!-- =========================
             DIVIDER
        ========================== -->

        <div class="divider">
            OR
        </div>


        <!-- =========================
             EMAIL LOGIN
        ========================== -->

        <input
            type="email"
            id="email"
            class="email-input"
            placeholder="Enter your email"
            autocomplete="email"
        >

        <button
            type="button"
            id="email-login"
            class="email-button"
        >
            Continue with Email
        </button>


        <!-- Status / Error message -->
        <div
            id="auth-message"
            class="message"
            aria-live="polite"
        ></div>


        <!-- =========================
             BACK TO WEBSITE
        ========================== -->

        <a
            href="index.html"
            class="back-link"
        >
            ← Back to AiSmartOS
        </a>


        <p class="footer">
            © 2026 AiSmartOS
        </p>

    </div>


    <!-- =================================================
         SUPABASE JAVASCRIPT LIBRARY
         MUST LOAD BEFORE auth.js
    ================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- =================================================
         AiSmartOS AUTHENTICATION SCRIPT
    ================================================== -->

    <script src="auth.js"></script>

</body>
</html>
