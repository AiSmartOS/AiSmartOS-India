<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AiSmartOS Inc. | ACE AI Core</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#04070f;--ink:#d6ecff;--muted:#7b93b0;--cyan:#3df2ff;--violet:#8b5cf6;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#04070f;--ink:#d6ecff;--muted:#7b93b0}}
:root[data-theme="dark"]{--bg:#04070f;--ink:#d6ecff;--muted:#7b93b0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:
  radial-gradient(ellipse at 50% 48%,#0c1d3a 0,transparent 60%),
  linear-gradient(rgba(61,242,255,.05) 1px,transparent 1px) 0 0/40px 40px,
  linear-gradient(90deg,rgba(61,242,255,.05) 1px,transparent 1px) 0 0/40px 40px,
  var(--bg);
  color:var(--ink);font-family:"Chakra Petch",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{padding:18px 24px 0;text-align:center}
h1{margin:0;font-size:clamp(22px,4vw,38px);font-weight:700;letter-spacing:.04em}
header p{margin:4px 0 0;color:var(--muted);font-size:clamp(12px,1.7vw,16px)}
svg{flex:1;min-height:0;width:100%}
footer{padding:0 24px 16px;display:flex;justify-content:center;align-items:center;gap:10px;font-size:clamp(12px,1.6vw,15px);color:var(--cyan);min-height:24px}
#dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.bk{fill:#070d1a}
.gl{fill:url(#glass);stroke:currentColor;stroke-width:1.5}
.ln{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round}
.nm{font-size:15px;font-weight:700;text-anchor:middle;fill:currentColor;letter-spacing:.05em}
.ds{font-size:11px;text-anchor:middle;fill:var(--muted)}
.base{fill:none;stroke-width:1.4;opacity:.45;stroke-dasharray:1;filter:url(#glow)}
.flow{fill:none;stroke-width:2.2;stroke-dasharray:4 16;stroke-linecap:round;animation:fl 1.1s linear infinite;filter:url(#glow)}
@keyframes fl{to{stroke-dashoffset:-20}}
.rate{font-size:10px;text-anchor:middle;fill:var(--ink);paint-order:stroke;stroke:#04070f;stroke-width:4px}
.core-t{font-size:34px;font-weight:700;text-anchor:middle;fill:#fff;letter-spacing:.12em}
.core-s{font-size:9px;text-anchor:middle;fill:var(--cyan);letter-spacing:.2em}
@media (prefers-reduced-motion:reduce){.flow{animation:none}}
</style>
</head>
<body>
<header>
  <h1>AiSmartOS Inc.</h1>
  <p>One ACE core. Six operating systems. Every screen in sync.</p>
</header>

<svg id="scene" viewBox="0 0 1000 740" preserveAspectRatio="xMidYMid meet" role="img" aria-label="ACE AI core connected to six devices">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#fff" stop-opacity=".1"/>
    </linearGradient>
    <radialGradient id="coreg"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#3df2ff"/><stop offset=".7" stop-color="#6b3cf0" stop-opacity=".85"/><stop offset="1" stop-color="#6b3cf0" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g id="lines"></g>
  <g id="devs"></g>
  <g id="core" transform="translate(500 365)">
    <circle class="pulse" r="60" fill="none" stroke="#3df2ff" stroke-width="2" opacity="0"/>
    <circle class="glowc" r="110" fill="url(#coreg)" opacity=".55"/>
    <circle class="ring r1" r="118" fill="none" stroke="#3df2ff" stroke-width="1.2" stroke-dasharray="3 9" opacity=".6"/>
    <circle class="ring r2" r="96" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="40 18 6 18" opacity=".85"/>
    <polygon class="ring r3" points="0,-76 66,-38 66,38 0,76 -66,38 -66,-38" fill="#050b18" fill-opacity=".85" stroke="#3df2ff" stroke-width="2" filter="url(#glow)"/>
    <text class="core-t" y="6">ACE</text>
    <text class="core-s" y="26">AI CORE ENGINE</text>
  </g>
</svg>

<footer><span id="dot"></span><span id="tk">ACE core online</span></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function(){
const CX=500, CY=365;
const gl=(x,y,w,h,r)=>`<rect class="bk" x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}"/><rect class="gl" x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}"/>`;
const bars=(x,y,w)=>[0,1,2].map(i=>`<rect class="bar" x="${x}" y="${y+i*11}" width="${w*[.9,.6,.75][i]}" height="4" rx="2" fill="currentColor" opacity=".75"/>`).join('');

const D=[
 {n:'DexOS',d:'Desktop',x:200,y:170,c:'#3df2ff',h:54,s:gl(-70,-46,140,82,6)+bars(-56,-32,112)+'<path class="gl" d="M-8 36h16v12h-16zM-30 48h60v5h-60z"/>'},
 {n:'WideOS',d:'Tablet',x:500,y:110,c:'#a78bfa',h:42,s:gl(-56,-42,112,84,10)+bars(-42,-28,84)},
 {n:'ViewOS',d:'Smart TV',x:800,y:170,c:'#5cffb0',h:56,s:gl(-82,-48,164,92,5)+bars(-66,-32,132)+'<path class="ln" d="M-50 44l-8 12M50 44l8 12"/>'},
 {n:'WinOS',d:'Phone',x:200,y:600,c:'#ff4fd8',h:50,s:gl(-27,-50,54,100,11)+bars(-18,-26,36)+'<rect x="-8" y="-45" width="16" height="4" rx="2" fill="currentColor" opacity=".6"/>'},
 {n:'TimeOS',d:'Watch',x:500,y:630,c:'#ffb84d',h:56,s:'<path class="gl" d="M-15 -30l3 -24h24l3 24M-15 30l3 24h24l3 -24"/>'+gl(-30,-30,60,60,16)+'<path class="ln" d="M0 0V-16M0 0l11 6"/><circle r="3" fill="currentColor"/>'},
 {n:'EduOS',d:'Smart board',x:800,y:600,c:'#6fa8ff',h:60,s:gl(-90,-52,180,104,5)+bars(-74,-36,148)+'<path class="gl" d="M-70 52v8h140v-8"/>'}
];

let L='', V='';
D.forEach((o,i)=>{
  const qx=(CX+o.x)/2+(o.y-CY)*.18, qy=(CY+o.y)/2-(o.x-CX)*.18;
  o.p=`M${CX},${CY} Q${qx},${qy} ${o.x},${o.y}`;
  L+=`<g data-i="${i}"><path class="base" pathLength="1" d="${o.p}" stroke="${o.c}"/><path class="flow" d="${o.p}" stroke="${o.c}"/>`+
     `<text class="rate" dy="-8">0 GB/s</text><circle class="pk" r="3.5" fill="${o.c}" opacity="0" filter="url(#glow)"/><circle class="pk" r="3.5" fill="#fff" opacity="0" filter="url(#glow)"/></g>`;
  V+=`<g transform="translate(${o.x} ${o.y})"><g class="dev" style="color:${o.c}">${o.s}`+
     `<text class="nm" y="${o.h+18}">${o.n}</text><text class="ds" y="${o.h+34}">${o.d}</text></g></g>`;
});
document.getElementById('lines').innerHTML=L;
document.getElementById('devs').innerHTML=V;

const $$=s=>[...document.querySelectorAll(s)];
const paths=$$('.flow'), groups=$$('#lines g'), devs=$$('.dev'), tk=document.getElementById('tk');
const lens=paths.map(p=>p.getTotalLength());

// midpoint readouts
groups.forEach((g,i)=>{const pt=paths[i].getPointAtLength(lens[i]*.5);const t=g.querySelector('.rate');t.setAttribute('x',pt.x);t.setAttribute('y',pt.y);});

const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

function fly(i,k,dir,dur){
  const pk=groups[i].querySelectorAll('.pk')[k], o={p:0};
  gsap.to(o,{p:1,duration:dur,ease:'power1.inOut',
    onStart:()=>pk.setAttribute('opacity',1),
    onUpdate:()=>{const t=dir>0?o.p:1-o.p,pt=paths[i].getPointAtLength(t*lens[i]);pk.setAttribute('cx',pt.x);pk.setAttribute('cy',pt.y);},
    onComplete:()=>pk.setAttribute('opacity',0)});
}

if(!reduce){
  // intro
  const tl=gsap.timeline({defaults:{ease:'power3.out'}});
  tl.from('h1',{opacity:0,y:-14,duration:.8})
    .from('header p',{opacity:0,duration:.8},'-=.4')
    .from('.glowc',{attr:{r:0},opacity:0,duration:1.2},'-=.4')
    .from('.ring',{attr:{r:0},opacity:0,duration:1,stagger:.12},'-=1')
    .from('.core-t,.core-s',{opacity:0,duration:.6},'-=.5')
    .from('.base',{strokeDashoffset:1,duration:1.4,stagger:.1,ease:'power2.inOut'},'-=.2')
    .from('.flow',{opacity:0,duration:.6,stagger:.08},'-=1')
    .from('.dev',{opacity:0,y:26,duration:.8,stagger:.12},'-=1.2')
    .from('footer',{opacity:0,duration:.6},'-=.4')
    .add(start);

  gsap.to('.r1',{rotation:360,duration:40,repeat:-1,ease:'none'});
  gsap.to('.r2',{rotation:-360,duration:22,repeat:-1,ease:'none'});
  gsap.to('.glowc',{opacity:.85,scale:1.06,duration:1.8,yoyo:true,repeat:-1,ease:'sine.inOut',transformOrigin:'50% 50%'});
  gsap.to('.bar',{scaleX:()=>gsap.utils.random(.4,1),duration:()=>gsap.utils.random(.6,1.4),yoyo:true,repeat:-1,ease:'sine.inOut',transformOrigin:'0% 50%',stagger:{each:.07,repeat:-1,yoyo:true}});
}else{
  tk.textContent='ACE core linked to DexOS, WinOS, WideOS, TimeOS, ViewOS and EduOS';
  groups.forEach(g=>g.querySelector('.rate').textContent='');
}

function start(){
  // ambient packets
  groups.forEach((g,i)=>{
    (function loop(){
      const dir=Math.random()>.5?1:-1;
      fly(i,i%2,dir,gsap.utils.random(1.1,1.9));
      gsap.delayedCall(gsap.utils.random(.7,2),loop);
    })();
  });
  // live readouts
  setInterval(()=>groups.forEach(g=>{
    const t=g.querySelector('.rate'), v=(Math.random()*9+1).toFixed(1);
    t.textContent=v+' GB/s';
  }),1200);

  // cue cycle: ACE hands work to each device in turn
  const msg=[
   'ACE core syncing workspace to DexOS desktop',
   'ACE core streaming tablet canvas to WideOS',
   'ACE core casting live scenes to ViewOS TV',
   'ACE core pushing alerts to WinOS phone',
   'ACE core sending health sync to TimeOS watch',
   'ACE core sharing lessons with EduOS smart board'
  ];
  let n=0;
  (function cue(){
    const i=n%6; n++;
    gsap.to(tk,{opacity:0,duration:.2,onComplete:()=>{tk.textContent=msg[i];gsap.to(tk,{opacity:1,duration:.3});}});
    gsap.fromTo('.pulse',{attr:{r:60},opacity:.9},{attr:{r:150},opacity:0,duration:1.2,ease:'power2.out'});
    fly(i,0,1,.9);
    gsap.delayedCall(.25,()=>fly(i,1,1,.9));
    gsap.delayedCall(1,()=>{
      const gls=devs[i].querySelectorAll('.gl,.ln');
      gsap.fromTo(gls,{strokeWidth:4,stroke:'#ffffff'},{strokeWidth:1.5,stroke:D[i].c,duration:1,ease:'power2.out'});
      gsap.fromTo(devs[i],{y:0},{y:-6,duration:.25,yoyo:true,repeat:1,ease:'sine.inOut'});
    });
    gsap.delayedCall(2.6,cue);
  })();
}
if(reduce)start=null;
})();
</script>
</body>
</html>
